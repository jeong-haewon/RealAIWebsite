<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="../assets/images/logo/REAL_AI_LOGO_Square.png">
    <title>Events - REAL AI Lab</title>
    <link rel="stylesheet" href="../css/styles.css">
    <style>
        .events-layout {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 2rem;
            margin-top: 1.5rem;
        }

        /* Calendar Styles */
        .calendar-container {
            background: white;
            border: 1px solid var(--border-light);
            border-radius: 8px;
            padding: 1.25rem;
            position: sticky;
            top: 100px;
            height: fit-content;
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .calendar-header h3 {
            font-size: 1rem;
            font-weight: 500;
            color: var(--text-primary);
            margin: 0;
        }

        .calendar-nav {
            display: flex;
            gap: 0.5rem;
        }

        .calendar-nav button {
            background: none;
            border: 1px solid var(--border-light);
            border-radius: 4px;
            padding: 0.25rem 0.5rem;
            cursor: pointer;
            color: var(--text-secondary);
            transition: all 0.2s ease;
        }

        .calendar-nav button:hover {
            border-color: var(--sky-blue);
            color: var(--sky-blue);
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 2px;
        }

        .calendar-day-header {
            text-align: center;
            font-size: 0.7rem;
            font-weight: 500;
            color: var(--text-secondary);
            padding: 0.5rem 0;
        }

        .calendar-day {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            color: var(--text-secondary);
            border-radius: 50%;
            cursor: default;
            position: relative;
        }

        .calendar-day.other-month {
            color: #ccc;
        }

        .calendar-day.has-event {
            background: var(--sky-blue);
            color: white;
            font-weight: 500;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .calendar-day.has-event:hover {
            transform: scale(1.1);
        }

        .calendar-day.today {
            border: 2px solid var(--sky-blue);
        }

        .calendar-day.selected {
            box-shadow: 0 0 0 2px var(--text-primary);
        }

        /* Event List Styles */
        .events-list {
            margin-bottom: 3rem;
        }

        .events-year-section {
            margin-bottom: 2rem;
        }

        .events-year-title {
            font-size: 1.25rem;
            font-weight: 500;
            color: var(--text-primary);
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid var(--sky-blue);
        }

        .event-card {
            background: white;
            border: 1px solid var(--border-light);
            border-radius: 8px;
            overflow: hidden;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: row;
            margin-bottom: 1rem;
            padding: 1.25rem;
        }

        .event-card:hover {
            border-color: var(--sky-blue);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
        }

        .event-card .image-container {
            width: 120px;
            min-width: 120px;
            height: 120px;
            overflow: hidden;
            background: linear-gradient(135deg, #f8fbfc 0%, #e8f4f8 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            margin-right: 1.5rem;
            box-shadow: 0 2px 12px rgba(100, 189, 227, 0.25), 0 0 0 1px rgba(100, 189, 227, 0.15);
            transition: box-shadow 0.3s ease;
        }

        .event-card:hover .image-container {
            box-shadow: 0 4px 20px rgba(100, 189, 227, 0.35), 0 0 0 1px rgba(100, 189, 227, 0.25);
        }

        .event-card .image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }

        .event-card .image-container.no-image {
            background: linear-gradient(135deg, #f0f7fa 0%, #e0eff5 100%);
        }

        .event-card .image-container.no-image::after {
            content: '';
            width: 40px;
            height: 40px;
            background: rgba(100, 189, 227, 0.15);
            border-radius: 50%;
        }

        .event-card .content {
            padding: 0.25rem 0;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .event-card .date {
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--sky-blue);
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .event-card h3 {
            font-size: 1.05rem;
            font-weight: 500;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
            line-height: 1.4;
        }

        .event-card .speaker {
            font-size: 0.95rem;
            color: var(--text-primary);
            font-weight: 500;
            margin-bottom: 0.25rem;
        }

        .event-card .affiliation {
            font-size: 0.85rem;
            color: var(--text-secondary);
            line-height: 1.5;
        }

        .event-card .youtube-link {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            margin-top: 0.65rem;
            font-size: 0.8rem;
            font-weight: 500;
            color: #cc0000;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .event-card .youtube-link:hover {
            color: #990000;
        }

        .event-card .youtube-link svg {
            width: 16px;
            height: 16px;
            flex-shrink: 0;
        }

        /* Upcoming vs Past styling */
        .upcoming-label {
            display: inline-block;
            background: var(--sky-blue);
            color: white;
            font-size: 0.7rem;
            font-weight: 500;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            margin-left: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        @media (max-width: 900px) {
            .events-layout {
                grid-template-columns: 1fr;
            }

            .calendar-container {
                position: static;
            }
        }

        @media (max-width: 768px) {
            .event-card {
                flex-direction: column;
                align-items: center;
                text-align: center;
            }

            .event-card .image-container {
                margin-right: 0;
                margin-bottom: 1rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <nav class="container">
            <div class="logo-group">
                <a href="https://www.ucsb.edu" target="_blank" class="ucsb-logo">
                    <img src="../assets/images/logo/UC_Santa_Barbara_Wordmark_Navy_RGB.png" alt="UC Santa Barbara">
                </a>
                <a href="../index.html" class="logo">REAL AI</a>
            </div>
            <ul class="nav-links">
                <li><a href="../index.html">Home</a></li>
                <li><a href="people.html">People</a></li>
                <li><a href="publications.html">Publications</a></li>
                <li><a href="news.html">News</a></li>
                <li><a href="events.html" class="active">Events</a></li>
                <li><a href="careers.html">Careers</a></li>
                <li><a href="give.html">Give</a></li>
            </ul>
            <button class="nav-toggle" aria-label="Toggle navigation">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </nav>
    </header>

    <main>
        <section class="page-header">
            <div class="container">
                <h1>Events</h1>
            </div>
        </section>

        <section class="content-section">
            <div class="container">
                <div class="events-layout">
                    <div class="calendar-container">
                        <div class="calendar-header">
                            <h3 id="calendar-month-year"></h3>
                            <div class="calendar-nav">
                                <button id="prev-month">&larr;</button>
                                <button id="next-month">&rarr;</button>
                            </div>
                        </div>
                        <div class="calendar-grid" id="calendar-grid">
                            <div class="calendar-day-header">Su</div>
                            <div class="calendar-day-header">Mo</div>
                            <div class="calendar-day-header">Tu</div>
                            <div class="calendar-day-header">We</div>
                            <div class="calendar-day-header">Th</div>
                            <div class="calendar-day-header">Fr</div>
                            <div class="calendar-day-header">Sa</div>
                        </div>
                    </div>

                    <div class="events-list" id="events-container">
                        <!-- Events will be rendered here -->
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <div class="footer-content">
                <div class="footer-brand">
                    <span class="logo">REAL AI</span>
                    <p>Reliable, Efficient, and Aligned AI</p>
                </div>
                <nav class="footer-nav">
                    <a href="news.html">News</a>
                    <a href="people.html">People</a>
                    <a href="publications.html">Publications</a>
                    <a href="events.html">Events</a>
                    <a href="careers.html">Careers</a>
                    <a href="give.html">Give</a>
                </nav>
            </div>
            <div class="footer-bottom">
                <p>&copy; 2025 REAL AI, UC Santa Barbara. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script src="../js/main.js"></script>
    <script>
        // Calendar state
        let currentDate = new Date();
        let currentMonth = currentDate.getMonth();
        let currentYear = currentDate.getFullYear();

        // Format date for display
        function formatDate(dateStr) {
            const date = new Date(dateStr + 'T00:00:00');
            const options = { month: 'short', day: 'numeric', year: 'numeric' };
            return date.toLocaleDateString('en-US', options);
        }

        // Check if date is in the future
        function isUpcoming(dateStr) {
            const eventDate = new Date(dateStr + 'T00:00:00');
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            return eventDate >= today;
        }

        // Render calendar
        function renderCalendar() {
            const grid = document.getElementById('calendar-grid');
            const monthYearLabel = document.getElementById('calendar-month-year');

            const monthNames = ['January', 'February', 'March', 'April', 'May', 'June',
                               'July', 'August', 'September', 'October', 'November', 'December'];

            monthYearLabel.textContent = monthNames[currentMonth] + ' ' + currentYear;

            // Clear existing days (keep headers)
            const headers = [];
            grid.querySelectorAll('.calendar-day-header').forEach(h => headers.push(h.cloneNode(true)));
            grid.innerHTML = '';
            headers.forEach(h => grid.appendChild(h));

            // Get first day of month and total days
            const firstDay = new Date(currentYear, currentMonth, 1).getDay();
            const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
            const daysInPrevMonth = new Date(currentYear, currentMonth, 0).getDate();

            // Today's date
            const today = new Date();
            const todayStr = today.getFullYear() + '-' + String(today.getMonth() + 1).padStart(2, '0') + '-' + String(today.getDate()).padStart(2, '0');

            // Previous month days
            for (let i = firstDay - 1; i >= 0; i--) {
                const day = document.createElement('div');
                day.className = 'calendar-day other-month';
                day.textContent = daysInPrevMonth - i;
                grid.appendChild(day);
            }

            // Current month days
            for (let d = 1; d <= daysInMonth; d++) {
                const day = document.createElement('div');
                day.className = 'calendar-day';
                day.textContent = d;

                const dateStr = currentYear + '-' + String(currentMonth + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');

                if (dateStr === todayStr) {
                    day.classList.add('today');
                }

                if (eventDates.has(dateStr)) {
                    day.classList.add('has-event');
                    day.title = 'Event on this day';
                    day.addEventListener('click', function() { scrollToEvent(dateStr); });
                }

                grid.appendChild(day);
            }

            // Next month days
            const totalCells = firstDay + daysInMonth;
            const remainingCells = totalCells % 7 === 0 ? 0 : 7 - (totalCells % 7);
            for (let i = 1; i <= remainingCells; i++) {
                const day = document.createElement('div');
                day.className = 'calendar-day other-month';
                day.textContent = i;
                grid.appendChild(day);
            }
        }

        // Scroll to event by date
        function scrollToEvent(dateStr) {
            const eventCard = document.querySelector('[data-date="' + dateStr + '"]');
            if (eventCard) {
                eventCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
                eventCard.style.boxShadow = '0 0 0 3px var(--sky-blue)';
                setTimeout(function() {
                    eventCard.style.boxShadow = '';
                }, 2000);
            }
        }

        // Render events list
        function renderEvents() {
            const container = document.getElementById('events-container');
            if (!container) return;

            // Sort events by date (newest first)
            const sortedEvents = eventsData.slice().sort(function(a, b) { return new Date(b.date) - new Date(a.date); });

            // Group by year
            const eventsByYear = {};
            sortedEvents.forEach(function(event) {
                const year = event.date.split('-')[0];
                if (!eventsByYear[year]) {
                    eventsByYear[year] = [];
                }
                eventsByYear[year].push(event);
            });

            let html = '';

            // Render each year section
            Object.keys(eventsByYear).sort(function(a, b) { return b - a; }).forEach(function(year) {
                const hasUpcoming = eventsByYear[year].some(function(e) { return isUpcoming(e.date); });
                html += '<div class="events-year-section">';
                html += '<h2 class="events-year-title">' + year + (hasUpcoming ? '<span class="upcoming-label">Upcoming</span>' : '') + '</h2>';

                eventsByYear[year].forEach(function(event) {
                    const upcoming = isUpcoming(event.date);
                    html += '<div class="event-card" data-date="' + event.date + '">' +
                            '<div class="image-container ' + (event.image ? '' : 'no-image') + '">' +
                            (event.image ? '<img src="../assets/images/events/' + event.image + '" alt="' + event.speaker + '">' : '') +
                            '</div>' +
                            '<div class="content">' +
                            '<p class="date">' + formatDate(event.date) + (upcoming ? ' <span class="upcoming-label">Upcoming</span>' : '') + '</p>' +
                            '<h3>' + event.title + '</h3>' +
                            '<p class="speaker">' + event.speaker + '</p>' +
                            '<p class="affiliation">' + event.affiliation + '</p>' +
                            (event.youtube_url ? '<a class="youtube-link" href="' + event.youtube_url + '" target="_blank" rel="noopener noreferrer"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>Watch Talk</a>' : '') +
                            '</div>' +
                            '</div>';
                });

                html += '</div>';
            });

            container.innerHTML = html;
        }

        // Active events data
        let eventsData = [];
        let eventDates = new Set();

        // Load events from JSON file
        async function loadEvents() {
            try {
                const response = await fetch('../data/events.json');
                if (!response.ok) throw new Error('Fetch failed');
                eventsData = await response.json();

                // Update event dates for calendar
                eventDates = new Set();
                eventsData.forEach(event => {
                    eventDates.add(event.date);
                });

                renderCalendar();
                renderEvents();
            } catch (error) {
                console.error('Failed to load events:', error.message);
                document.getElementById('events-container').innerHTML = '<p>Unable to load events. Please try again later.</p>';
                renderCalendar();
            }
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            loadEvents();

            // Calendar navigation
            document.getElementById('prev-month').addEventListener('click', function() {
                currentMonth--;
                if (currentMonth < 0) {
                    currentMonth = 11;
                    currentYear--;
                }
                renderCalendar();
            });

            document.getElementById('next-month').addEventListener('click', function() {
                currentMonth++;
                if (currentMonth > 11) {
                    currentMonth = 0;
                    currentYear++;
                }
                renderCalendar();
            });
        });
    </script>
</body>
</html>
